<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'"><title>艺界星途 · 离线升级助手</title><link rel="stylesheet" href="helper.css"><script src="steps.js" defer></script><script src="helper.js" defer></script></head><body><main><h1>艺界星途 · 离线升级助手</h1><p>仅在本机显示SQL，无网络请求，不连接数据库。先阅读《逐步上线清单》，确认备份、停写和数据库名称。这里的“已执行”只是手工记录，不能证明云端执行成功。</p><label>已经完整完成的数据库版本 <select id="current"><option value="23">0023（已验收阶段6）</option><option value="22">0022</option><option value="21">0021（阶段4）</option><option value="24">0024（最终版，无需重复升级）</option><option value="0">全新空库（依次0001–0024）</option></select></label><button id="start">生成后续步骤</button><p>不知道版本或上次只执行一部分：先停下，交后端核对，不要猜选。</p><hr><p id="summary"></p><label>当前步骤 <select id="step"></select></label><p id="detail"></p><textarea id="sql" readonly spellcheck="false" aria-label="完整SQL"></textarea><div><button id="copy">复制完整SQL</button><button id="done">云端已成功，记下并进入下一步</button></div><p id="notice" role="status"></p><h2>本次手工记录</h2><textarea id="history" readonly aria-label="本次手工执行记录"></textarea><button id="save">下载记录</button><p>每次只执行这里显示的一个完整语句。触发器BEGIN…END必须整体复制。云端报错时立即停止，保存错误、数据库ID及本记录；不跳步、不重复从头执行。</p></main></body></html>
