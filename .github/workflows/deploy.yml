# 合并到 main 后自动部署到 Cloudflare Pages。缺少 secrets 时自动跳过。
# 腾讯云 CVM 迁移待域名备案完成后再接入，见 docs/automation/SETUP.md。
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - run: npm run build && npm test
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CF_PAGES_PROJECT != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main
      - name: Skipped
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CF_PAGES_PROJECT == ''
        run: echo "未配置 CLOUDFLARE_API_TOKEN 或 CF_PAGES_PROJECT，跳过"
