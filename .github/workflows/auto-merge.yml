# 带 ready 标签且没有 blocked/needs-claude 标签的 PR，开启 auto-merge；CI 全绿后由 GitHub 自动合并。
name: Auto merge
on:
  pull_request_target:
    types: [labeled, unlabeled, opened, synchronize, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write
jobs:
  enable:
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ready') &&
      !contains(github.event.pull_request.labels.*.name, 'blocked') &&
      !contains(github.event.pull_request.labels.*.name, 'needs-claude') &&
      !github.event.pull_request.draft
    steps:
      - run: gh pr merge "$PR" --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
