# 按改动路径给 PR 分流：高风险打 needs-claude（等 Claude 裁决），其余放行。只调用 API，不检出 PR 代码。
name: Triage
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: write
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Label risky changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          RISKY='^(migrations/|\.github/|deploy/|platform/|server\.mjs$|package(-lock)?\.json$|scripts/build\.mjs$|src/server/.*(auth|access|session|permission|security|crypto|identity|platform|backup))'
          hits=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[].filename' | grep -Ei "$RISKY" || true)
          if [ -n "$hits" ]; then
            gh label create needs-claude --color d93f0b --description "高风险改动，等待 Claude 裁决" 2>/dev/null || true
            gh pr edit "$PR" --add-label needs-claude
            gh pr comment "$PR" --body "高风险路径改动，已打 \`needs-claude\`，不会自动合并：
          $(echo "$hits" | head -20 | sed 's/^/- /')"
          fi
