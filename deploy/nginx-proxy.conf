client_max_body_size 32m;
client_body_timeout 200s;
if (-f /etc/yijiexingtu/maintenance.flag) { return 503; }
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_timeout 1d;
access_log /var/log/nginx/yijiexingtu-access.log yxt;
limit_req_status 429;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/javascript text/javascript text/css application/json;
location / {
    limit_req zone=yxt_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 200s;
    proxy_send_timeout 200s;
    proxy_buffering off;
    proxy_request_buffering on;
}
