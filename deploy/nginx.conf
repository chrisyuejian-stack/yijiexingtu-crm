# Loaded inside nginx's http {} by /etc/nginx/conf.d/yijiexingtu.conf.
map $uri $yxt_login_ip {
    default "";
    ~^/(?:[^/]+/)?api/(?:auth/login|login|setup)(?:/|$) $binary_remote_addr;
}
limit_req_zone $yxt_login_ip zone=yxt_login:10m rate=20r/m;
log_format yxt '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name edu.yijiexingtu.com ops.yijiexingtu.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/yijiexingtu/tls/fullchain.pem;
    ssl_certificate_key /etc/yijiexingtu/tls/key.pem;
    return 404;
}
server {
    listen 443 ssl;
    server_name edu.yijiexingtu.com;
    ssl_certificate /etc/yijiexingtu/tls/fullchain.pem;
    ssl_certificate_key /etc/yijiexingtu/tls/key.pem;
    include /etc/nginx/yijiexingtu-proxy.conf;
}
server {
    listen 443 ssl;
    server_name ops.yijiexingtu.com;
    ssl_certificate /etc/yijiexingtu/tls/fullchain.pem;
    ssl_certificate_key /etc/yijiexingtu/tls/key.pem;
    auth_basic "Yijiexingtu operations";
    auth_basic_user_file /etc/yijiexingtu/ops.htpasswd;
    include /etc/nginx/yijiexingtu-proxy.conf;
}
